<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINTONIA - A programação nas suas mãos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <!-- Menu Lateral -->
    <aside class="sidebar">
        <div class="brand">
            <h1>SINTONIA</h1>
            <p>Gestão de TV</p>
        </div>
        <nav>
            <button class="nav-btn active" id="navHome">Início</button>
            <button class="nav-btn" id="navNovo">Novo Programa</button>
        </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <header class="header">
            <h2>A programação nas suas mãos.</h2>
            <div class="dashboard-counters">
                <div class="counter">
                    <span class="counter-value" id="countProgramas">0</span>
                    <span class="counter-label">Programas</span>
                </div>
                <div class="counter">
                    <span class="counter-value" id="countEmissoras">0</span>
                    <span class="counter-label">Emissoras</span>
                </div>
                <div class="counter">
                    <span class="counter-value" id="countCategorias">0</span>
                    <span class="counter-label">Categorias</span>
                </div>
            </div>
            <button class="btn-primary" id="btnNovoProgramaHeader">Novo programa</button>
        </header>

        <!-- Barra de Ferramentas -->
        <section class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por nome ou ID..." aria-label="Buscar programa">
                <button class="btn-icon" id="btnClearSearch" aria-label="Limpar busca">&times;</button>
            </div>
            <div class="filters">
                <select id="filterCategoria" aria-label="Filtrar por categoria">
                    <option value="">Todas as Categorias</option>
                </select>
                <select id="sortList" aria-label="Ordenar programas">
                    <option value="nome_asc">Nome (A-Z)</option>
                    <option value="nome_desc">Nome (Z-A)</option>
                    <option value="id_asc">ID (Crescente)</option>
                    <option value="id_desc">ID (Decrescente)</option>
                </select>
            </div>
        </section>

        <!-- Status de Carregamento e Mensagens -->
        <div id="statusMessage" class="status-message hidden"></div>

        <!-- Grade de Programas -->
        <section class="program-grid" id="programGrid">
            <!-- Cartões injetados via JS -->
        </section>
    </main>
</div>

<!-- Modal de Formulário (Cadastro/Edição) -->
<div class="modal hidden" id="formModal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
    <div class="modal-content">
        <header class="modal-header">
            <h3 id="modalTitle">Novo Programa</h3>
            <button class="btn-close" aria-label="Fechar modal">&times;</button>
        </header>
        <form id="programaForm">
            <input type="hidden" id="programaId">

            <div class="form-group">
                <label for="nome">Nome do Programa <span class="required">*</span></label>
                <input type="text" id="nome" name="nome" maxlength="25" placeholder="Ex: Jornal Nacional" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria <span class="required">*</span></label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecione uma categoria...</option>
                    <option value="Anime">Anime</option>
                    <option value="Auditório">Auditório</option>
                    <option value="Ciência e Tecnologia">Ciência e Tecnologia</option>
                    <option value="Culinária / Gastronomia">Culinária / Gastronomia</option>
                    <option value="Debate">Debate</option>
                    <option value="Desenho Animado">Desenho Animado</option>
                    <option value="Documentário">Documentário</option>
                    <option value="Educativo">Educativo</option>
                    <option value="Entretenimento">Entretenimento</option>
                    <option value="Entrevista / Talk Show">Entrevista / Talk Show</option>
                    <option value="Esporte">Esporte</option>
                    <option value="Filme">Filme</option>
                    <option value="Game Show">Game Show</option>
                    <option value="Humor / Comédia">Humor / Comédia</option>
                    <option value="Infantil">Infantil</option>
                    <option value="Jornalismo">Jornalismo</option>
                    <option value="Minissérie">Minissérie</option>
                    <option value="Musical">Musical</option>
                    <option value="Novela">Novela</option>
                    <option value="Policial">Policial</option>
                    <option value="Reality Show">Reality Show</option>
                    <option value="Religioso">Religioso</option>
                    <option value="Rural / Agronegócio">Rural / Agronegócio</option>
                    <option value="Série">Série</option>
                    <option value="Televendas">Televendas</option>
                    <option value="Turismo / Viagem">Turismo / Viagem</option>
                    <option value="Variedades">Variedades</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="emissora">Emissora <span class="required">*</span></label>
                <input type="text" id="emissora" name="emissora" maxlength="25" placeholder="Ex: Globo" required>
            </div>

            <div class="form-group">
                <label for="class_indic">Classificação Indicativa <span class="required">*</span></label>
                <select id="class_indic" name="class_indic" required>
                    <option value="" disabled selected>Selecione a classificação...</option>
                    <option value="Livre">Livre</option>
                    <option value="10 anos">10 anos</option>
                    <option value="12 anos">12 anos</option>
                    <option value="14 anos">14 anos</option>
                    <option value="16 anos">16 anos</option>
                    <option value="18 anos">18 anos</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary btn-cancelar">Cancelar</button>
                <button type="submit" class="btn-primary" id="btnSalvar">Salvar</button>
            </div>
            <div id="formError" class="form-error hidden"></div>
        </form>
    </div>
</div>

<!-- Modal de Detalhes -->
<div class="modal hidden" id="detailsModal" role="dialog" aria-modal="true">
    <div class="modal-content">
        <header class="modal-header">
            <h3>Detalhes do Programa</h3>
            <button class="btn-close" aria-label="Fechar modal">&times;</button>
        </header>
        <div class="details-body" id="detailsBody">
            <!-- Preenchido via JS -->
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-danger" id="btnDeleteDetail">Excluir</button>
            <button type="button" class="btn-primary" id="btnEditDetail">Editar</button>
        </div>
    </div>
</div>

<!-- Modal de Confirmação de Exclusão -->
<div class="modal hidden" id="deleteModal" role="dialog" aria-modal="true">
    <div class="modal-content modal-small">
        <header class="modal-header">
            <h3>Confirmar Exclusão</h3>
        </header>
        <div class="modal-body">
            <p>Tem certeza que deseja excluir o programa <strong id="deleteProgramName"></strong>?</p>
            <p class="text-danger">Esta ação não pode ser desfeita.</p>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-secondary btn-cancel-delete">Cancelar</button>
            <button type="button" class="btn-danger" id="btnConfirmDelete">Sim, Excluir</button>
        </div>
        <div id="deleteError" class="form-error hidden"></div>
    </div>
</div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
