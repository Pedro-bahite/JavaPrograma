<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard TV - Programas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Gerenciador de Programas de TV</h1>

<div class="dashboard-container">

    <div class="dashboard-top">

        <div class="card">
            <h2>Criar Novo</h2>
            <input type="text" id="nome" class="valida-criar" placeholder="Nome do Programa">
            <select id="categoria" class="valida-criar">
                <option value="" disabled selected>Categoria</option>
                <option value="Desenho">Desenho</option>
                <option value="Seriado">Seriado</option>
                <option value="Filme">Filme</option>
                <option value="Jornal">Jornal</option>
                <option value="Novela">Novela</option>
                <option value="Programa de auditório">Programa de auditório</option>
                <option value="Esporte">Esporte</option>
                <option value="Reality show">Reality show</option>
            </select>
            <input type="text" id="emissora" class="valida-criar" placeholder="Emissora">
            <select id="class_indic" class="valida-criar">
                <option value="" disabled selected>Classificação</option>
                <option value="Livre">Livre para todas as idades</option>
                <option value="10 anos">+10 anos</option>
                <option value="12 anos">+12 anos</option>
                <option value="14 anos">+14 anos</option>
                <option value="16 anos">+16 anos</option>
                <option value="18 anos">+18 anos</option>
            </select>
            <button id="btnCriar" onclick="criar()" disabled>Salvar</button>
        </div>

        <div class="card">
            <h2>Atualizar Existente</h2>
            <input type="number" id="id" class="valida-atualizar" placeholder="ID do Programa" readonly>
            <input type="text" id="novoNome" class="valida-atualizar" placeholder="Novo Nome">
            <select id="novaCategoria" class="valida-atualizar">
                <option value="" disabled selected>Nova Categoria</option>
                <option value="Desenho">Desenho</option>
                <option value="Seriado">Seriado</option>
                <option value="Filme">Filme</option>
                <option value="Jornal">Jornal</option>
                <option value="Novela">Novela</option>
                <option value="Programa de auditório">Programa de auditório</option>
                <option value="Esporte">Esporte</option>
                <option value="Reality show">Reality show</option>
            </select>
            <input type="text" id="novaEmissora" class="valida-atualizar" placeholder="Nova Emissora">
            <select id="novaClassIndic" class="valida-atualizar">
                <option value="" disabled selected>Nova Classificação</option>
                <option value="Livre">Livre para todas as idades</option>
                <option value="10 anos">+10 anos</option>
                <option value="12 anos">+12 anos</option>
                <option value="14 anos">+14 anos</option>
                <option value="16 anos">+16 anos</option>
                <option value="18 anos">+18 anos</option>
            </select>
            <button id="btnAtualizar" onclick="atualizar()" disabled>Atualizar</button>
        </div>

        <div class="card">
            <h2>Buscar Programa</h2>
            <input type="text" id="buscarNome" class="valida-buscar" placeholder="Digite parte do nome">
            <button id="btnBuscar" onclick="buscar()" disabled>Pesquisar</button>
            <button onclick="listarTodos()" class="btn-secundario">Limpar Busca</button>
        </div>

        <div class="card">
            <h2>Deletar</h2>
            <input type="text" id="deletarNome" class="valida-deletar" placeholder="Nome Exato do Programa">
            <button id="btnDeletar" onclick="deletar()" class="btn-perigo" disabled>Deletar</button>
        </div>

    </div>

    <main class="painel-tabela">
        <div class="tabela-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Emissora</th>
                    <th>Classificação</th>
                </tr>
                </thead>
                <tbody id="tabelaCorpo">
                </tbody>
            </table>
        </div>
    </main>

</div>

<script>
    const api = "/programa";

    function configurarValidacao(classeInputs, idBotao) {
        const inputs = document.querySelectorAll(`.${classeInputs}`);
        const botao = document.getElementById(idBotao);

        if (!botao || inputs.length === 0) return;

        function checarCampos() {
            const todosPreenchidos = Array.from(inputs).every(input => input.value.trim() !== "");
            botao.disabled = !todosPreenchidos;
        }

        inputs.forEach(input => {
            input.addEventListener("input", checarCampos);
            input.addEventListener("change", checarCampos);
        });
    }

    configurarValidacao("valida-criar", "btnCriar");
    configurarValidacao("valida-atualizar", "btnAtualizar");
    configurarValidacao("valida-buscar", "btnBuscar");
    configurarValidacao("valida-deletar", "btnDeletar");

    function limparFormularios() {
        document.querySelectorAll('.valida-criar, .valida-atualizar, .valida-deletar').forEach(input => input.value = "");
        document.getElementById("btnCriar").disabled = true;
        document.getElementById("btnAtualizar").disabled = true;
        document.getElementById("btnDeletar").disabled = true;
    }

    function carregarDadosParaEdicao(programa) {
        limparFormularios();

        document.getElementById("id").value = programa.id;
        document.getElementById("novoNome").value = programa.nome;
        document.getElementById("novaCategoria").value = programa.categoria;
        document.getElementById("novaEmissora").value = programa.emissora;
        document.getElementById("novaClassIndic").value = programa.class_indic || programa.classIndic;
        document.getElementById("deletarNome").value = programa.nome;

        document.querySelectorAll('.valida-atualizar, .valida-deletar').forEach(input => {
            input.dispatchEvent(new Event('input'));
            input.dispatchEvent(new Event('change'));
        });
    }

    function renderizarTabela(programas) {
        const tbody = document.getElementById("tabelaCorpo");
        tbody.innerHTML = "";
        programas.forEach(p => {
            const tr = document.createElement("tr");
            tr.onclick = () => carregarDadosParaEdicao(p);
            tr.innerHTML = `
                <td>${p.id}</td>
                <td><strong>${p.nome}</strong></td>
                <td>${p.categoria}</td>
                <td>${p.emissora}</td>
                <td>${p.class_indic || p.classIndic}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function listarTodos() {
        document.getElementById("buscarNome").value = "";
        document.getElementById("btnBuscar").disabled = true;
        try {
            const resp = await fetch(api);
            if (resp.ok) renderizarTabela(await resp.json());
        } catch (e) { console.error(e); }
    }

    async function buscar() {
        const nome = document.getElementById("buscarNome").value;
        const url = nome ? `${api}?nome=${encodeURIComponent(nome)}` : api;
        try {
            const resp = await fetch(url);
            if (resp.ok) {
                const dados = await resp.json();
                renderizarTabela(dados);
            } else {
                alert("Erro ao buscar.");
            }
        } catch (e) { console.error(e); }
    }

    async function criar() {
        await fetch(api, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome: document.getElementById("nome").value,
                categoria: document.getElementById("categoria").value,
                emissora: document.getElementById("emissora").value,
                class_indic: document.getElementById("class_indic").value
            })
        });

        limparFormularios();
        listarTodos();
    }

    async function atualizar() {
        const id = document.getElementById("id").value;
        await fetch(`${api}?id=${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome: document.getElementById("novoNome").value,
                categoria: document.getElementById("novaCategoria").value,
                emissora: document.getElementById("novaEmissora").value,
                class_indic: document.getElementById("novaClassIndic").value
            })
        });

        limparFormularios();
        listarTodos();
    }

    async function deletar() {
        const nome = document.getElementById("deletarNome").value;
        await fetch(`${api}?nome=${encodeURIComponent(nome)}`, { method: "DELETE" });

        limparFormularios();
        listarTodos();
    }

    listarTodos();
</script>
</body>
</html>
